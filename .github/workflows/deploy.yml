name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/endothedev/check-bpm:latest
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ponytail: no SSH deploy step - the Pi-side watcher loop is the
      # reliable path (proven across camelot-wheel's deploys).
      - name: Note
        run: echo "image pushed to GHCR - Pi watcher picks it up"
